name: Deploy personal Lawson copy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p _site
          # Publish the existing static game without changing its source files.
          # Exclude repository metadata and the generated output directory.
          rsync -a --exclude='.git' --exclude='_site' --exclude='.github' ./ _site/
          if [ ! -f _site/index.html ]; then
            echo "::error::No index.html exists at the repository root. Configure the game's actual entry HTML before deploying."
            echo "Top-level files and folders:"
            find . -maxdepth 2 -not -path './.git*' -not -path './_site*' -type f | sort | head -100
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
